{% for label, href, state in pills %}{% if state == "current" %}<a class="pill" aria-current="page" href="{{ href }}">{{ label }}</a>{% elif state == "only" %}<a class="pill only" href="{{ href }}">{{ label }}</a>{% elif href %}<a class="pill" href="{{ href }}">{{ label }}</a>{% else %}<span class="pill none" title="No {{ label }} variant">{{ label }} –</span>{% endif %}{% endfor %}

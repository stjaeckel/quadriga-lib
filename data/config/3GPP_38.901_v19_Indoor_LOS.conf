% Config file for scenario "3GPP_38.901_v19_Indoor_LOS"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         1 to 150 m
% Valid BS antenna height:      3 m
% Valid MT antenna height:      1 m

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, Table 7.5-10
% ==================================================================================================

% DS  = -7.692 - 0.01 * log10( 1 + fGHz ) + Xds * ( 0.18 )
% KF  = 7 + Xkf * ( 4 )
% SF  = Xsf * ( 3 )
% ASD = 1.6 + Xasd * ( 0.18 )
% ASA = 1.781 - 0.19 * log10( 1 + fGHz ) + Xasa * ( 0.119 + 0.12 * log10( 1 + fGHz ) )
% ESD = 2.228 - 1.43 * log10( 1 + fGHz ) + Xesd * ( 0.3 + 0.13 * log10( 1 + fGHz ) ), see below
% ESA = 1.44 - 0.26 * log10( 1 + fGHz ) + Xesa * ( 0.264 - 0.04 * log10( 1 + fGHz ) )
% XPR = 11 + Xxpr * ( 4 )

% For frequencies below 6 GHz, fc = 6 GHz is used in the frequency-dependent terms (LSP_fc_min).

DS_mu =               -7.692        % delay spread [log10(s)]
DS_sigma =             0.18         % delay spread STD [log10(s)]
DS_omega =             1            % reference frequency offset for the DS [GHz]
DS_gamma =            -0.01         % freq.-dep. of DS [log10(s)/log10(GHz)]

KF_mu =                7            % Ricean K-factor [dB]
KF_sigma =             4            % Ricean K-factor STD [dB]

SF_sigma =             3            % Shadow Fading STD [dB]

AS_D_mu =              1.6          % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.18         % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.781        % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.119        % azimuth of arrival angle spread STD [log10(deg)]
AS_A_omega =           1            % reference frequency offset for the ASA [GHz]
AS_A_gamma =          -0.19         % freq.-dep. of ASA [log10(deg)/log10(GHz)]
AS_A_delta =           0.12         % freq.-dep. of ASA STD [log10(deg)/log10(GHz)]

% ESD mean (TR: mu_lgZSD) = -1.43 log10(1 + fc) + 2.228, STD 0.13 log10(1 + fc) + 0.30

ES_D_mu =              2.228        % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.3          % elevation of departure angle spread STD [log10(deg)]
ES_D_omega =           1            % reference frequency offset for the ESD [GHz]
ES_D_gamma =          -1.43         % freq.-dep. of ESD [log10(deg)/log10(GHz)]
ES_D_delta =           0.13         % freq.-dep. of ESD STD [log10(deg)/log10(GHz)]

ES_A_mu =              1.44         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.264        % elevation of arrival angle spread STD [log10(deg)]
ES_A_omega =           1            % reference frequency offset for the ESA [GHz]
ES_A_gamma =          -0.26         % freq.-dep. of ESA [log10(deg)/log10(GHz)]
ES_A_delta =          -0.04         % freq.-dep. of ESA STD [log10(deg)/log10(GHz)]

XPR_mu =               11           % cross-polarization ratio [dB]
XPR_sigma =            4            % cross-polarization ratio STD [dB]

LSP_fc_min =           6            % lower limit of fc for the frequency-dependent terms [GHz]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

DS_lambda =            8            % DS decorrelation distance [m]
KF_lambda =            4            % KF decorrelation distance [m]
SF_lambda =            10           % SF decorrelation distance [m]
AS_D_lambda =          7            % ASD decorrelation distance [m]
AS_A_lambda =          5            % ASA decorrelation distance [m]
ES_D_lambda =          4            % ESD decorrelation distance [m]
ES_A_lambda =          4            % ESA decorrelation distance [m]
XPR_lambda =           5            % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1     -0.5   -0.8    0.6    0.8    0.1    0.2    0     | DS
%     |  -0.5    1      0.5    0      0      0      0.1    0     | KF
%     |  -0.8    0.5    1     -0.4   -0.5    0.2    0.3    0     | SF
% R = |   0.6    0     -0.4    1      0.4    0.5    0      0     | ASD
%     |   0.8    0     -0.5    0.4    1      0      0.5    0     | ASA
%     |   0.1    0      0.2    0.5    0      1      0      0     | ESD
%     |   0.2    0.1    0.3    0      0.5    0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_kf =               -0.5          % DS vs. KF
ds_sf =               -0.8          % DS vs. SF
asD_ds =               0.6          % DS vs. ASD
asA_ds =               0.8          % DS vs. ASA
esD_ds =               0.1          % DS vs. ESD
esA_ds =               0.2          % DS vs. ESA
sf_kf =                0.5          % KF vs. SF
esA_kf =               0.1          % KF vs. ESA
asD_sf =              -0.4          % SF vs. ASD
asA_sf =              -0.5          % SF vs. ASA
esD_sf =               0.2          % SF vs. ESD
esA_sf =               0.3          % SF vs. ESA
asD_asA =              0.4          % ASD vs. ASA
esD_asD =              0.5          % ASD vs. ESD
esA_asA =              0.5          % ASA vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          16           % number of clusters (15 NLOS clusters + 1 for the LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
NumClusters_min =      8            % lower end of the cluster-count range, counted like NumClusters (TR: D1 = 7)

r_DS =                 3.6          % delay scaling factor
LNS_ksi =              6            % per cluster shadowing STD [dB]

PerClusterAS_D =       5            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       8            % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       3.922        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       9            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = ESD mean at 6 GHz.

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                4            % number of strongest clusters with scaling factor 1
NF_alpha =             1.25         % parameter alpha of the Beta distribution
NF_beta =              1.27         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.31         % mean of the probability Pr_sns
SNS_sigma =            0.08         % STD of the probability Pr_sns
SNS_A =                0            % visibility region parameter A
SNS_B =                0.6          % visibility region parameter B
SNS_R =                0            % visibility region parameter R [dB]; 0 = not applicable (A = 0)
SNS_delta_var =        0.0011       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            10           % decorrelation distance [m]; 0 = disabled

% The decorrelation distances of the LOS/NLOS state and the indoor/outdoor state (Table 7.6.3.1-2) apply to all
% links of a scenario and are stated once: LOS_state_lambda in the NLOS file(s), IO_state_lambda in the O2I files.
% In the other files of the scenario these keys are 0, which means "not stated here".

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL = 32.4 + 17.3 log10(d3D) + 20 log10(fc)
% NLOS: PL = max( PL_LOS, 38.3 log10(d3D) + 17.30 + 24.9 log10(fc) )

% Formula for the QuaDRiGa model "logdist":
%     PL = A * log10( d3D ) + B + C * log10( fGHz )

PL_model =             logdist      % path-loss model
PL_A =                 17.3         % TX-RX 3D dist.-dep. of PL [dB/log10(m)]
PL_B =                 32.4         % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]

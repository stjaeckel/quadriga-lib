% Config file for scenario "3GPP_38.901_v19_SMa_NLOS_O2I"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 37 GHz (LSPs up to 24 GHz)
% Valid distance range:         10 to 5000 m
% Valid BS antenna height:      25 to 35 m
% Valid MT antenna height:      1 to 14 m

% Outdoor-to-indoor (O2I) link with NLOS propagation on the outdoor part.
% LSPs from the O2I column; path loss of the outdoor NLOS scenario. The building penetration
% loss (3GPP TR 38.901 v19.5.0, clause 7.4.3) is not part of this file.

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-4, Table 7.5-12
% ==================================================================================================

% DS  = -7.2 + Xds * ( 0.58 )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 8 )
% ASD = 0.51 + Xasd * ( 0.33 )
% ASA = 1.63 + Xasa * ( 0.26 )
% ESD = 0.14 + Xesd * ( 0.16 ), see below
% ESA = 1.16 + Xesa * ( 0.14 )
% XPR = 4 + Xxpr * ( 3 )

DS_mu =               -7.2          % delay spread [log10(s)]
DS_sigma =             0.58         % delay spread STD [log10(s)]

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             8            % Shadow Fading STD [dB]

AS_D_mu =              0.51         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.33         % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.63         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.26         % azimuth of arrival angle spread STD [log10(deg)]

% ESD mean (TR: mu_lgZSD) = 0.14

ES_D_mu =              0.14         % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.16         % elevation of departure angle spread STD [log10(deg)]

ES_A_mu =              1.16         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.14         % elevation of arrival angle spread STD [log10(deg)]

XPR_mu =               4            % cross-polarization ratio [dB]
XPR_sigma =            3            % cross-polarization ratio STD [dB]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-4
% ==================================================================================================

DS_lambda =            40           % DS decorrelation distance [m]
KF_lambda =            10           % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            50           % SF decorrelation distance [m]
AS_D_lambda =          30           % ASD decorrelation distance [m]
AS_A_lambda =          30           % ASA decorrelation distance [m]
ES_D_lambda =          50           % ESD decorrelation distance [m]
ES_A_lambda =          50           % ESA decorrelation distance [m]
XPR_lambda =           15           % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-4
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0     -0.13   0      0.7   -0.5    0      0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |  -0.13   0      1     -0.4    0      0     -0.47   0     | SF
% R = |   0      0     -0.4    1      0      0.5   -0.1    0     | ASD
%     |   0.7    0      0      0      1      0      0.36   0     | ASA
%     |  -0.5    0      0      0.5    0      1      0      0     | ESD
%     |   0      0     -0.47  -0.1    0.36   0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_sf =               -0.13         % DS vs. SF
asA_ds =               0.7          % DS vs. ASA
esD_ds =              -0.5          % DS vs. ESD
asD_sf =              -0.4          % SF vs. ASD
esA_sf =              -0.47         % SF vs. ESA
esD_asD =              0.5          % ASD vs. ESD
esA_asD =             -0.1          % ASD vs. ESA
esA_asA =              0.36         % ASA vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-4, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          15           % number of clusters (14 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)

r_DS =                 1.5          % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterDS =         6.5622       % cluster delay spread [ns] @ 1 GHz
PerClusterDS_gamma =  -3.4084       % freq.-dep. of cluster delay spread [ns/log10(GHz)]
PerClusterDS_min =     0.25         % minimum cluster delay spread [ns]
PerClusterAS_D =       1.33         % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       10           % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       0.518        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       7            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 0.14 of the ESD mean.

O2I_d2D_in_max =       25           % maximum indoor 2D distance [m], clause 7.4.3.1; argument d2d_in_max of o2i_loss
% SMa: 25 m for UTs in commercial buildings, 10 m for UTs in residential buildings.

% ==================================================================================================
% EoD offset (elevation of departure, TR: ZOD offset)
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-12
% ==================================================================================================

% TR: mu_offset,ZOD = atan((hBS - hcl)/d2D) - atan((hBS - hUT)/d2D) for hUT < hcl, 0 otherwise; hcl = 3.5 m
%
% QuaDRiGa uses elevation angles: EoD offset = - mu_offset,ZOD. A positive value raises the departure direction.
%
% EoD offset [deg] = EoD_offset_e + EoD_offset_e_gamma * log10(fGHz)
%       + 10^( (EoD_offset_a + EoD_offset_a_gamma * log10(fGHz)) * log10(max(EoD_offset_b, d2D))
%              + EoD_offset_c + EoD_offset_c_gamma * log10(fGHz) + EoD_offset_c_hUT * hUT )     if EoD_offset_b > 0
%       + atand((hcl - hBS)/d2D) - atand((hUT - hBS)/d2D)                                       if hcl > 0 and hUT < hcl

EoD_offset_hcl =       3.5          % clutter height [m] of the geometric EoD offset; 0 = disabled

% ==================================================================================================
% Absolute time of arrival offset
% See: 3GPP TR 38.901 v19.5.0; Clause 7.6.9, Table 7.6.9-1
% ==================================================================================================

absTOA_mu =           -7.702        % absolute time of arrival offset reference value [log10(s)]
absTOA_sigma =         0.4          % absolute time of arrival offset reference STD [log10(s)]
absTOA_lambda =        50           % absolute time of arrival offset decorrelation distance [m]

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1: the TR has no values for SMa

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.24         % mean of the probability Pr_sns
SNS_sigma =            0.07         % STD of the probability Pr_sns
SNS_A =                0.06         % visibility region parameter A
SNS_B =                0.56         % visibility region parameter B
SNS_R =                23           % visibility region parameter R [dB]
SNS_delta_var =        0.0013       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            15           % decorrelation distance [m]; 0 = disabled

IO_state_lambda =      50           % decorrelation distance of the indoor/outdoor state [m], Table 7.6.3.1-2; used by the caller

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL1 = 20 log10(40 pi d3D fc/3) + min(0.03 h^1.72, 10) log10(d3D) - min(0.044 h^1.72, 14.77) + 0.002 log10(h) d3D
%       PL2 = PL1(dBP) + 40 log10(d3D/dBP);  dBP = 2 pi hBS hUT fc/c (note 5)
% NLOS: PL = 161.04 - 7.1 log10(W) + 7.5 log10(h) - (24.37 - 3.7 (h/hBS)^2) log10(hBS)
%             + (43.42 - 3.1 log10(hBS)) (log10(d3D) - 3) + 20 log10(fc) - (3.2 (log10(11.75 hUT))^2 - 4.97)
% The constants below are evaluated for h = 10 m (building height) and W = 10 m (street width).

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Formula for the QuaDRiGa model "nlos":
%    PLn = An * log10( d3D ) + Bn + Cn * log10( fGHz ) + Dn * log10( hBS ) + D2n * log10( hBS ) / hBS^2
%        + E3n * hUT + Fn * log10( hBS ) * log10( d3D ) + G1n * log10^2( G2n * hUT )
%     PL = max( PL_LOS, PLn )

% The TR has no max( PL_LOS, PLn ) for SMa NLOS. The LOS term is switched off by A1 = A2 = B = C = 0;
% E and hE are stated because the QuaDRiGa model needs them.

% Break point of note 5: dBP = 2 pi hBS hUT fc/c gives E = 2 pi / 0.3 = 20.944 and hE = 0.

PL_model =             nlos         % path-loss model
PL_A1 =                0            % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                0            % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 0            % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 0            % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 20.944       % Breakpoint scaling factor
PL_hE =                0            % Environment height in [m]
PL_An =                43.42        % TX-RX 3D dist.-dep. of NLOS-PL [dB/log10(m)]
PL_Bn =                36.15        % Reference NLOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_Cn =                20           % Freq.-dep. of the NLOS-PL in [dB/log10(GHz)]
PL_Dn =               -15.07        % BS height-dep. of the NLOS-PL in [dB/log10(m)]
PL_D2n =               370          % BS height-dep. of the NLOS-PL in [dB*m^2/log10(m)]
PL_Fn =               -3.1          % Combined BS height and dist.-dep. of the NLOS-PL [dB/log10(m)^2]
PL_G1n =              -3.2          % RX height-dep. of the NLOS-PL [dB/log10(m)^2]
PL_G2n =               11.75        % Scaling of the RX height in the NLOS-PL

% Config file for scenario "3GPP_38.901_v19_UMa_NLOS_O2I"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         10 to 5000 m
% Valid BS antenna height:      25 m
% Valid MT antenna height:      1.5 to 22.5 m

% Outdoor-to-indoor (O2I) link with NLOS propagation on the outdoor part.
% LSPs from the O2I column; path loss of the outdoor NLOS scenario. The building penetration
% loss (3GPP TR 38.901 v19.5.0, clause 7.4.3) is not part of this file.

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, Table 7.5-7
% ==================================================================================================

% DS  = -6.62 + Xds * ( 0.32 )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 7 )
% ASD = 0.58 + Xasd * ( 0.7 )
% ASA = 1.76 + Xasa * ( 0.16 )
% ESD = 0.915 + Xesd * ( 0.49 ), see below
% ESA = 1.01 + Xesa * ( 0.43 )
% XPR = 9 + Xxpr * ( 5 )

% For frequencies below 6 GHz, fc = 6 GHz is used in the frequency-dependent terms (LSP_fc_min).

DS_mu =               -6.62         % delay spread [log10(s)]
DS_sigma =             0.32         % delay spread STD [log10(s)]

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             7            % Shadow Fading STD [dB]

AS_D_mu =              0.58         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.7          % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.76         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.16         % azimuth of arrival angle spread STD [log10(deg)]

% ESD mean (TR: mu_lgZSD) = max[-0.5, -2.1 (d2D/1000) - 0.01 (hUT - 1.5) + 0.9]
%          = max( ES_D_mu_min, ES_D_mu + ES_D_mu_A * d2D/1000 + ES_D_mu_B * hUT )
% ES_D_mu includes the constant of the height term: 0.9 + 0.01 * 1.5

ES_D_mu =              0.915        % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.49         % elevation of departure angle spread STD [log10(deg)]
ES_D_mu_min =         -0.5          % minimum ESD reference value [log10(deg)]
ES_D_mu_A =           -2.1          % TX-RX 2D dist.-dep. of ESD [log10(deg)/km]
ES_D_mu_B =           -0.01         % RX height-dep. of ESD [log10(deg)/m]

ES_A_mu =              1.01         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.43         % elevation of arrival angle spread STD [log10(deg)]

XPR_mu =               9            % cross-polarization ratio [dB]
XPR_sigma =            5            % cross-polarization ratio STD [dB]

LSP_fc_min =           6            % lower limit of fc for the frequency-dependent terms [GHz]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

DS_lambda =            10           % DS decorrelation distance [m]
KF_lambda =            10           % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            7            % SF decorrelation distance [m]
AS_D_lambda =          11           % ASD decorrelation distance [m]
AS_A_lambda =          17           % ASA decorrelation distance [m]
ES_D_lambda =          25           % ESD decorrelation distance [m]
ES_A_lambda =          25           % ESA decorrelation distance [m]
XPR_lambda =           15           % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0     -0.5    0.4    0.4   -0.6   -0.2    0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |  -0.5    0      1      0.2    0      0      0      0     | SF
% R = |   0.4    0      0.2    1      0     -0.2    0      0     | ASD
%     |   0.4    0      0      0      1      0      0.5    0     | ASA
%     |  -0.6    0      0     -0.2    0      1      0.5    0     | ESD
%     |  -0.2    0      0      0      0.5    0.5    1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_sf =               -0.5          % DS vs. SF
asD_ds =               0.4          % DS vs. ASD
asA_ds =               0.4          % DS vs. ASA
esD_ds =              -0.6          % DS vs. ESD
esA_ds =              -0.2          % DS vs. ESA
asD_sf =               0.2          % SF vs. ASD
esD_asD =             -0.2          % ASD vs. ESD
esA_asA =              0.5          % ASA vs. ESA
esD_esA =              0.5          % ESD vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          13           % number of clusters (12 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
NumClusters_min =      11           % lower end of the cluster-count range, counted like NumClusters (TR: D1 = 10)

r_DS =                 2.2          % delay scaling factor
LNS_ksi =              4            % per cluster shadowing STD [dB]

PerClusterDS =         11           % cluster delay spread [ns]
PerClusterAS_D =       1.8          % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       8            % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       2.979        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       3            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 0.9 of the ESD mean.

O2I_d2D_in_max =       25           % maximum indoor 2D distance [m], clause 7.4.3.1; argument d2d_in_max of o2i_loss

% ==================================================================================================
% EoD offset (elevation of departure, TR: ZOD offset)
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-7
% ==================================================================================================

% TR: mu_offset,ZOD = e(fc) - 10^{ a(fc) log10(max(b(fc), d2D)) + c(fc) - 0.07 (hUT - 1.5) }
%     a(fc) = 0.208 log10(fc) - 0.782;  b(fc) = 25;  c(fc) = -0.13 log10(fc) + 2.03;  e(fc) = 7.66 log10(fc) - 5.96
%
% QuaDRiGa uses elevation angles: EoD offset = - mu_offset,ZOD. A positive value raises the departure direction.
%
% EoD offset [deg] = EoD_offset_e + EoD_offset_e_gamma * log10(fGHz)
%       + 10^( (EoD_offset_a + EoD_offset_a_gamma * log10(fGHz)) * log10(max(EoD_offset_b, d2D))
%              + EoD_offset_c + EoD_offset_c_gamma * log10(fGHz) + EoD_offset_c_hUT * hUT )     if EoD_offset_b > 0
%       + atand((hcl - hBS)/d2D) - atand((hUT - hBS)/d2D)                                       if hcl > 0 and hUT < hcl

EoD_offset_e =         5.96         % constant of the EoD offset [deg]; TR value with opposite sign
EoD_offset_e_gamma =  -7.66         % freq.-dep. of the constant [deg/log10(GHz)]; TR value with opposite sign
EoD_offset_a =        -0.782        % distance exponent
EoD_offset_a_gamma =   0.208        % freq.-dep. of the distance exponent [1/log10(GHz)]
EoD_offset_b =         25           % minimum 2D distance [m]; 0 = no power term
EoD_offset_c =         2.135        % constant of the exponent
EoD_offset_c_gamma =  -0.13         % freq.-dep. of the exponent [1/log10(GHz)]
EoD_offset_c_hUT =    -0.07         % RX height-dep. of the exponent [1/m]

% EoD_offset_c includes the constant of the height term: 2.03 + 0.07 * 1.5

% ==================================================================================================
% Absolute time of arrival offset
% See: 3GPP TR 38.901 v19.5.0; Clause 7.6.9, Table 7.6.9-1
% ==================================================================================================

absTOA_mu =           -7.4          % absolute time of arrival offset reference value [log10(s)]
absTOA_sigma =         0.2          % absolute time of arrival offset reference STD [log10(s)]
absTOA_lambda =        50           % absolute time of arrival offset decorrelation distance [m]

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                2            % number of strongest clusters with scaling factor 1
NF_alpha =             1.93         % parameter alpha of the Beta distribution
NF_beta =              1.33         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.56         % mean of the probability Pr_sns
SNS_sigma =            0.2          % STD of the probability Pr_sns
SNS_A =                0.15         % visibility region parameter A
SNS_B =                0.45         % visibility region parameter B
SNS_R =                33           % visibility region parameter R [dB]
SNS_delta_var =        0.0015       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            15           % decorrelation distance [m]; 0 = disabled

IO_state_lambda =      50           % decorrelation distance of the indoor/outdoor state [m], Table 7.6.3.1-2; used by the caller

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL1 = 28.0 + 22 log10(d3D) + 20 log10(fc);  PL2 = 28.0 + 40 log10(d3D) + 20 log10(fc) - 9 log10(dBP^2 + (hBS-hUT)^2)
%       dBP = 4 (hBS-hE) (hUT-hE) fc/c, hE = 1 m or random for hUT >= 13 m (note 1; PL_hE_rand = 1, drawn from column 10 of lsf_draw)
% NLOS: PL = max( PL_LOS, 13.54 + 39.08 log10(d3D) + 20 log10(fc) - 0.6 (hUT - 1.5) )

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Formula for the QuaDRiGa model "nlos":
%    PLn = An * log10( d3D ) + Bn + Cn * log10( fGHz ) + Dn * log10( hBS ) + D2n * log10( hBS ) / hBS^2
%        + E3n * hUT + Fn * log10( hBS ) * log10( d3D ) + G1n * log10^2( G2n * hUT )
%     PL = max( PL_LOS, PLn )

% Break point of note 1: dBP = 4 (hBS-hE) (hUT-hE) fc/c gives E = 4 / 0.3 = 40/3 = 13.33 and hE = 1.

PL_model =             nlos         % path-loss model
PL_A1 =                22           % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                40           % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 28           % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 13.33        % Breakpoint scaling factor
PL_hE =                1            % Environment height in [m]
PL_hE_rand =           1            % 1 = random environment height (TR 38.901 Table 7.4.1-1, note 1); 0 = fixed hE
PL_An =                39.08        % TX-RX 3D dist.-dep. of NLOS-PL [dB/log10(m)]
PL_Bn =                14.44        % Reference NLOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.; includes 0.6 * 1.5 of the height term
PL_Cn =                20           % Freq.-dep. of the NLOS-PL in [dB/log10(GHz)]
PL_E3n =              -0.6          % RX height-dep. of the NLOS-PL in [dB/m]

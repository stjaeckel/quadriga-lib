%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         10 to 5000 m
% Valid BS antenna height:      25 m
% Valid MT antenna height:      1.5 to 22.5 m

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, Table 7.5-7
% ==================================================================================================

% DS  = -7.067 - 0.0794 * log10( fGHz ) + Xds * ( 0.57 + 0.026 * log10( fGHz ) )
% KF  = 9 + Xkf * ( 3.5 )
% SF  = Xsf * ( 4 )
% ASD = 0.92 + Xasd * ( 0.31 )
% ASA = 1.76 + Xasa * ( 0.19 )
% ESD = 0.765 + Xesd * ( 0.4 ), see below
% ESA = 0.96 + Xesa * ( 0.15 )
% XPR = 8 + Xxpr * ( 4 )

% For frequencies below 6 GHz, fc = 6 GHz is used in the frequency-dependent terms (LSP_fc_min).

DS_mu =               -7.067        % delay spread [log10(s)] @ 1 GHz
DS_sigma =             0.57         % delay spread STD [log10(s)] @ 1 GHz
DS_gamma =            -0.0794       % freq.-dep. of DS [log10(s)/log10(GHz)]
DS_delta =             0.026        % freq.-dep. of DS STD [log10(s)/log10(GHz)]

KF_mu =                9            % Ricean K-factor [dB]
KF_sigma =             3.5          % Ricean K-factor STD [dB]

SF_sigma =             4            % Shadow Fading STD [dB]

AS_D_mu =              0.92         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.31         % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.76         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.19         % azimuth of arrival angle spread STD [log10(deg)]

% ESD mean (TR: mu_lgZSD) = max[-0.5, -2.1 (d2D/1000) - 0.01 (hUT - 1.5) + 0.75]
%          = max( ES_D_mu_min, ES_D_mu + ES_D_mu_A * d2D/1000 + ES_D_mu_B * hUT )
% ES_D_mu includes the constant of the height term: 0.75 + 0.01 * 1.5

ES_D_mu =              0.765        % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.4          % elevation of departure angle spread STD [log10(deg)]
ES_D_mu_min =         -0.5          % minimum ESD reference value [log10(deg)]
ES_D_mu_A =           -2.1          % TX-RX 2D dist.-dep. of ESD [log10(deg)/km]
ES_D_mu_B =           -0.01         % RX height-dep. of ESD [log10(deg)/m]

ES_A_mu =              0.96         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.15         % elevation of arrival angle spread STD [log10(deg)]

XPR_mu =               8            % cross-polarization ratio [dB]
XPR_sigma =            4            % cross-polarization ratio STD [dB]

LSP_fc_min =           6            % lower limit of fc for the frequency-dependent terms [GHz]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

DS_lambda =            30           % DS decorrelation distance [m]
KF_lambda =            12           % KF decorrelation distance [m]
SF_lambda =            37           % SF decorrelation distance [m]
AS_D_lambda =          18           % ASD decorrelation distance [m]
AS_A_lambda =          15           % ASA decorrelation distance [m]
ES_D_lambda =          15           % ESD decorrelation distance [m]
ES_A_lambda =          15           % ESA decorrelation distance [m]
XPR_lambda =           15           % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1     -0.4   -0.4    0.4    0.8   -0.2    0      0     | DS
%     |  -0.4    1      0      0     -0.2    0      0      0     | KF
%     |  -0.4    0      1     -0.5   -0.5    0     -0.8    0     | SF
% R = |   0.4    0     -0.5    1      0      0.5    0      0     | ASD
%     |   0.8   -0.2   -0.5    0      1     -0.3    0.4    0     | ASA
%     |  -0.2    0      0      0.5   -0.3    1      0      0     | ESD
%     |   0      0     -0.8    0      0.4    0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_kf =               -0.4          % DS vs. KF
ds_sf =               -0.4          % DS vs. SF
asD_ds =               0.4          % DS vs. ASD
asA_ds =               0.8          % DS vs. ASA
esD_ds =              -0.2          % DS vs. ESD
asA_kf =              -0.2          % KF vs. ASA
asD_sf =              -0.5          % SF vs. ASD
asA_sf =              -0.5          % SF vs. ASA
esA_sf =              -0.8          % SF vs. ESA
esD_asD =              0.5          % ASD vs. ESD
esD_asA =             -0.3          % ASA vs. ESD
esA_asA =              0.4          % ASA vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          12           % number of clusters
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
NumClusters_min =      10           % lower end of the cluster-count range, counted like NumClusters (TR: D1 = 10)

r_DS =                 2.5          % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterDS =         6.5622       % cluster delay spread [ns] @ 1 GHz
PerClusterDS_gamma =  -3.4084       % freq.-dep. of cluster delay spread [ns/log10(GHz)]
PerClusterDS_min =     0.25         % minimum cluster delay spread [ns]
PerClusterAS_D =       3.58         % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       11           % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       2.109        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       7            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 0.75 of the ESD mean.

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                2            % number of strongest clusters with scaling factor 1
NF_alpha =             1.93         % parameter alpha of the Beta distribution
NF_beta =              1.33         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.56         % mean of the probability Pr_sns
SNS_sigma =            0.2          % STD of the probability Pr_sns
SNS_A =                0.15         % visibility region parameter A
SNS_B =                0.45         % visibility region parameter B
SNS_R =                33           % visibility region parameter R [dB]
SNS_delta_var =        0.0015       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            40           % decorrelation distance [m]; 0 = disabled

% The decorrelation distances of the LOS/NLOS state and the indoor/outdoor state (Table 7.6.3.1-2) apply to all
% links of a scenario and are stated once: LOS_state_lambda in the NLOS file(s), IO_state_lambda in the O2I files.
% In the other files of the scenario these keys are 0, which means "not stated here".

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL1 = 28.0 + 22 log10(d3D) + 20 log10(fc);  PL2 = 28.0 + 40 log10(d3D) + 20 log10(fc) - 9 log10(dBP^2 + (hBS-hUT)^2)
%       dBP = 4 (hBS-hE) (hUT-hE) fc/c, hE = 1 m, or random for hUT > 13 m (note 1; PL_hE_rand = 1, drawn from the hE column of lsf_draw, index 10 counted from 0)
% NLOS: PL = max( PL_LOS, 13.54 + 39.08 log10(d3D) + 20 log10(fc) - 0.6 (hUT - 1.5) )

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Break point of note 1: dBP = 4 (hBS-hE) (hUT-hE) fc/c gives E = 4 / 0.3 = 40/3 = 13.33 and hE = 1.

PL_model =             dual_slope   % path-loss model
PL_A1 =                22           % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                40           % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 28           % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 13.33        % Breakpoint scaling factor
PL_hE =                1            % Environment height in [m]
PL_hE_rand =           1            % 1 = random environment height (TR 38.901 Table 7.4.1-1, note 1); 0 = fixed hE

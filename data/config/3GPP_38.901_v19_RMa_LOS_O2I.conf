% Config file for scenario "3GPP_38.901_v19_RMa_LOS_O2I"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 30 GHz (LSPs up to 7 GHz)
% Valid distance range:         10 to 10000 m (LOS), 10 to 5000 m (NLOS)
% Valid BS antenna height:      10 to 150 m, default 35 m
% Valid MT antenna height:      1 to 10 m, default 1.5 m

% Outdoor-to-indoor (O2I) link with LOS propagation on the outdoor part.
% LSPs from the O2I column; path loss of the outdoor LOS scenario. The building penetration
% loss (3GPP TR 38.901 v19.5.0, clause 7.4.3) is not part of this file.

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, Table 7.5-9
% ==================================================================================================

% DS  = -7.47 + Xds * ( 0.24 )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 8 )
% ASD = 0.67 + Xasd * ( 0.18 )
% ASA = 1.66 + Xasa * ( 0.21 )
% ESD = 0.295 + Xesd * ( 0.3 ), see below
% ESA = 0.93 + Xesa * ( 0.22 )
% XPR = 7 + Xxpr * ( 3 )

DS_mu =               -7.47         % delay spread [log10(s)]
DS_sigma =             0.24         % delay spread STD [log10(s)]

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             8            % Shadow Fading STD [dB]

AS_D_mu =              0.67         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.18         % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.66         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.21         % azimuth of arrival angle spread STD [log10(deg)]

% ESD mean (TR: mu_lgZSD) = max[-1, -0.19 (d2D/1000) - 0.01 (hUT - 1.5) + 0.28]
%          = max( ES_D_mu_min, ES_D_mu + ES_D_mu_A * d2D/1000 + ES_D_mu_B * hUT )
% ES_D_mu includes the constant of the height term: 0.28 + 0.01 * 1.5

ES_D_mu =              0.295        % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.3          % elevation of departure angle spread STD [log10(deg)]
ES_D_mu_min =         -1            % minimum ESD reference value [log10(deg)]
ES_D_mu_A =           -0.19         % TX-RX 2D dist.-dep. of ESD [log10(deg)/km]
ES_D_mu_B =           -0.01         % RX height-dep. of ESD [log10(deg)/m]

ES_A_mu =              0.93         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.22         % elevation of arrival angle spread STD [log10(deg)]

XPR_mu =               7            % cross-polarization ratio [dB]
XPR_sigma =            3            % cross-polarization ratio STD [dB]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

DS_lambda =            36           % DS decorrelation distance [m]
KF_lambda =            40           % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            120          % SF decorrelation distance [m]
AS_D_lambda =          30           % ASD decorrelation distance [m]
AS_A_lambda =          40           % ASA decorrelation distance [m]
ES_D_lambda =          50           % ESD decorrelation distance [m]
ES_A_lambda =          50           % ESA decorrelation distance [m]
XPR_lambda =           40           % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0      0      0      0      0      0      0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |   0      0      1      0      0      0      0      0     | SF
% R = |   0      0      0      1     -0.7    0.66   0.47   0     | ASD
%     |   0      0      0     -0.7    1     -0.55  -0.22   0     | ASA
%     |   0      0      0      0.66  -0.55   1      0      0     | ESD
%     |   0      0      0      0.47  -0.22   0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

asD_asA =             -0.7          % ASD vs. ASA
esD_asD =              0.66         % ASD vs. ESD
esA_asD =              0.47         % ASD vs. ESA
esD_asA =             -0.55         % ASA vs. ESD
esA_asA =             -0.22         % ASA vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          11           % number of clusters (10 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)

r_DS =                 1.7          % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterAS_D =       2            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       3            % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       0.715        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       3            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 0.28 of the ESD mean.

% ==================================================================================================
% EoD offset (elevation of departure, TR: ZOD offset)
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-9
% ==================================================================================================

% TR: mu_offset,ZOD = atan((35 - 3.5)/d2D) - atan((35 - 1.5)/d2D)
% Written with the actual heights: atan((hBS - hcl)/d2D) - atan((hBS - hUT)/d2D), hcl = 3.5 m.
% This is identical to the TR at the default heights hBS = 35 m, hUT = 1.5 m.
%
% QuaDRiGa uses elevation angles: EoD offset = - mu_offset,ZOD. A positive value raises the departure direction.
%
% EoD offset [deg] = EoD_offset_e + EoD_offset_e_gamma * log10(fGHz)
%       + 10^( (EoD_offset_a + EoD_offset_a_gamma * log10(fGHz)) * log10(max(EoD_offset_b, d2D))
%              + EoD_offset_c + EoD_offset_c_gamma * log10(fGHz) + EoD_offset_c_hUT * hUT )     if EoD_offset_b > 0
%       + atand((hcl - hBS)/d2D) - atand((hUT - hBS)/d2D)                                       if hcl > 0 and hUT < hcl

EoD_offset_hcl =       3.5          % clutter height [m] of the geometric EoD offset; 0 = disabled

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1: the TR has no values for RMa

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.14         % mean of the probability Pr_sns
SNS_sigma =            0.08         % STD of the probability Pr_sns
SNS_A =                0.16         % visibility region parameter A
SNS_B =                0.74         % visibility region parameter B
SNS_R =                60           % visibility region parameter R [dB]
SNS_delta_var =        0.0016       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            15           % decorrelation distance [m]; 0 = disabled

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL1 = 20 log10(40 pi d3D fc/3) + min(0.03 h^1.72, 10) log10(d3D) - min(0.044 h^1.72, 14.77) + 0.002 log10(h) d3D
%       PL2 = PL1(dBP) + 40 log10(d3D/dBP);  dBP = 2 pi hBS hUT fc/c (note 5)
% NLOS: PL = max( PL_LOS, 161.04 - 7.1 log10(W) + 7.5 log10(h) - (24.37 - 3.7 (h/hBS)^2) log10(hBS)
%                  + (43.42 - 3.1 log10(hBS)) (log10(d3D) - 3) + 20 log10(fc) - (3.2 (log10(11.75 hUT))^2 - 4.97) )
% The constants below are evaluated for the default values h = 5 m (building height) and W = 20 m (street width).

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Break point of note 5: dBP = 2 pi hBS hUT fc/c gives E = 2 pi / 0.3 = 20.944 and hE = 0.

PL_model =             dual_slope   % path-loss model
PL_A1 =                20.478       % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                40           % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 31.741       % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_D =                 0.0014       % TX-RX 3D dist.-dep. of LOS-PL [dB/m]
PL_E =                 20.944       % Breakpoint scaling factor
PL_hE =                0            % Environment height in [m]

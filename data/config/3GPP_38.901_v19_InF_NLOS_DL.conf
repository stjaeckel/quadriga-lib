% Config file for scenario "3GPP_38.901_v19_InF_NLOS_DL"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         1 to 600 m
% Valid BS antenna height:      1.5 or 8 m
% Valid MT antenna height:      1.5 m

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-3, Table 7.5-11
% ==================================================================================================

% DS  = -7.2138 + Xds * ( 0.19 )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 7.2 )
% ASD = 1.57 + Xasd * ( 0.2 )
% ASA = 1.72 + Xasa * ( 0.3 )
% ESD = 1.2 + Xesd * ( 0.55 ), see below
% ESA = 1.45 - 0.13 * log10( 1 + fGHz ) + Xesa * ( 0.45 )
% XPR = 11 + Xxpr * ( 6 )

DS_mu =               -7.2138       % delay spread [log10(s)]
DS_sigma =             0.19         % delay spread STD [log10(s)]
% The TR gives the InF delay spread as a function of the hall volume V and surface area S:
% log10(30 (V/S) + 32) - 9.44. The value above is carried over
% from the QuaDRiGa file for v16.1.0, which evaluates it for the average of two halls.

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             7.2          % Shadow Fading STD [dB]

AS_D_mu =              1.57         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.2          % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.72         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.3          % azimuth of arrival angle spread STD [log10(deg)]

% ESD mean (TR: mu_lgZSD) = 1.2

ES_D_mu =              1.2          % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.55         % elevation of departure angle spread STD [log10(deg)]

ES_A_mu =              1.45         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.45         % elevation of arrival angle spread STD [log10(deg)]
ES_A_omega =           1            % reference frequency offset for the ESA [GHz]
ES_A_gamma =          -0.13         % freq.-dep. of ESA [log10(deg)/log10(GHz)]

XPR_mu =               11           % cross-polarization ratio [dB]
XPR_sigma =            6            % cross-polarization ratio STD [dB]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-3
% ==================================================================================================

DS_lambda =            10           % DS decorrelation distance [m]
KF_lambda =            10           % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            10           % SF decorrelation distance [m]
AS_D_lambda =          10           % ASD decorrelation distance [m]
AS_A_lambda =          10           % ASA decorrelation distance [m]
ES_D_lambda =          10           % ESD decorrelation distance [m]
ES_A_lambda =          10           % ESA decorrelation distance [m]
XPR_lambda =           5            % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-3
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0      0      0      0      0      0      0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |   0      0      1      0      0      0      0      0     | SF
% R = |   0      0      0      1      0      0      0      0     | ASD
%     |   0      0      0      0      1      0      0      0     | ASA
%     |   0      0      0      0      0      1      0      0     | ESD
%     |   0      0      0      0      0      0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

% All correlations are 0

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-3, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          26           % number of clusters (25 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)

r_DS =                 3            % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterAS_D =       5            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       8            % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       5.943        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       9            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 1.2 of the ESD mean.

% ==================================================================================================
% Absolute time of arrival offset
% See: 3GPP TR 38.901 v19.5.0; Clause 7.6.9, Table 7.6.9-1
% ==================================================================================================

absTOA_mu =           -7.5          % absolute time of arrival offset reference value [log10(s)]
absTOA_sigma =         0.4          % absolute time of arrival offset reference STD [log10(s)]
absTOA_lambda =        6            % absolute time of arrival offset decorrelation distance [m]

% The TR bounds the excess delay by 2L/c, L = largest dimension of the factory hall.
% L depends on the deployment and is not set here: absTOA_Lmax = 0 means no bound.

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                4            % number of strongest clusters with scaling factor 1
NF_alpha =             1.38         % parameter alpha of the Beta distribution
NF_beta =              1.26         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.32         % mean of the probability Pr_sns
SNS_sigma =            0.06         % STD of the probability Pr_sns
SNS_A =                0            % visibility region parameter A
SNS_B =                0.57         % visibility region parameter B
SNS_R =                0            % visibility region parameter R [dB]; 0 = not applicable (A = 0)
SNS_delta_var =        0.002        % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            10           % decorrelation distance [m]; 0 = disabled

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL = 31.84 + 21.50 log10(d3D) + 19.00 log10(fc)
% NLOS: PL = max( PL_NLOS, PL_LOS ) with PL_NLOS = Bn + An log10(d3D) + 20 log10(fc):
%       InF-SL: 33 + 25.5 log10(d3D);  InF-DL: 18.6 + 35.7 log10(d3D);  InF-SH: 32.4 + 23.0 log10(d3D);  InF-DH: 33.63 + 21.9 log10(d3D)

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Formula for the QuaDRiGa model "nlos":
%    PLn = An * log10( d3D ) + Bn + Cn * log10( fGHz ) + Dn * log10( hBS ) + D2n * log10( hBS ) / hBS^2
%        + E3n * hUT + Fn * log10( hBS ) * log10( d3D ) + G1n * log10^2( G2n * hUT )
%     PL = max( PL_LOS, PLn )

% The TR takes the maximum of three terms for InF-DL: max( PL, PL_LOS, PL_InF-SL ). The QuaDRiGa model
% has two terms; the InF-SL term is missing. It is the largest of the three below about 26 m.

PL_model =             nlos         % path-loss model
PL_A1 =                21.5         % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                21.5         % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 31.84        % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 19           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 13.34        % Breakpoint scaling factor
PL_hE =                0            % Environment height in [m]
PL_An =                35.7         % TX-RX 3D dist.-dep. of NLOS-PL [dB/log10(m)]
PL_Bn =                18.6         % Reference NLOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_Cn =                20           % Freq.-dep. of the NLOS-PL in [dB/log10(GHz)]

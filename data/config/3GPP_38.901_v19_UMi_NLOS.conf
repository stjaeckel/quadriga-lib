%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         10 to 5000 m
% Valid BS antenna height:      10 m
% Valid MT antenna height:      1.5 to 22.5 m

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, Table 7.5-8
% ==================================================================================================

% DS  = -6.87 - 0.22 * log10( 1 + fGHz ) + Xds * ( 0.22 + 0.19 * log10( 1 + fGHz ) )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 7.82 )
% ASD = 1.54 - 0.24 * log10( 1 + fGHz ) + Xasd * ( 0.33 + 0.1 * log10( 1 + fGHz ) )
% ASA = 1.76 - 0.07 * log10( 1 + fGHz ) + Xasa * ( 0.27 + 0.05 * log10( 1 + fGHz ) )
% ESD = 0.2 + Xesd * ( 0.35 ), see below
% ESA = 0.92 - 0.03 * log10( 1 + fGHz ) + Xesa * ( 0.35 - 0.05 * log10( 1 + fGHz ) )
% XPR = 8 + Xxpr * ( 3 )

% For frequencies below 2 GHz, fc = 2 GHz is used in the frequency-dependent terms (LSP_fc_min).

DS_mu =               -6.87         % delay spread [log10(s)]
DS_sigma =             0.22         % delay spread STD [log10(s)]
DS_omega =             1            % reference frequency offset for the DS [GHz]
DS_gamma =            -0.22         % freq.-dep. of DS [log10(s)/log10(GHz)]
DS_delta =             0.19         % freq.-dep. of DS STD [log10(s)/log10(GHz)]

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             7.82         % Shadow Fading STD [dB]

AS_D_mu =              1.54         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.33         % azimuth of departure angle spread STD [log10(deg)]
AS_D_omega =           1            % reference frequency offset for the ASD [GHz]
AS_D_gamma =          -0.24         % freq.-dep. of ASD [log10(deg)/log10(GHz)]
AS_D_delta =           0.1          % freq.-dep. of ASD STD [log10(deg)/log10(GHz)]

AS_A_mu =              1.76         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.27         % azimuth of arrival angle spread STD [log10(deg)]
AS_A_omega =           1            % reference frequency offset for the ASA [GHz]
AS_A_gamma =          -0.07         % freq.-dep. of ASA [log10(deg)/log10(GHz)]
AS_A_delta =           0.05         % freq.-dep. of ASA STD [log10(deg)/log10(GHz)]

% ESD mean (TR: mu_lgZSD) = max[-0.5, -3.1 (d2D/1000) + 0.01 max(hUT - hBS, 0) + 0.2]
%          = max( ES_D_mu_min, ES_D_mu + ES_D_mu_A * d2D/1000 + ES_D_mu_D * max(hUT - hBS, 0) )

ES_D_mu =              0.2          % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.35         % elevation of departure angle spread STD [log10(deg)]
ES_D_mu_min =         -0.5          % minimum ESD reference value [log10(deg)]
ES_D_mu_A =           -3.1          % TX-RX 2D dist.-dep. of ESD [log10(deg)/km]
ES_D_mu_D =            0.01         % dep. of ESD on max(hUT - hBS, 0) [log10(deg)/m]

ES_A_mu =              0.92         % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.35         % elevation of arrival angle spread STD [log10(deg)]
ES_A_omega =           1            % reference frequency offset for the ESA [GHz]
ES_A_gamma =          -0.03         % freq.-dep. of ESA [log10(deg)/log10(GHz)]
ES_A_delta =          -0.05         % freq.-dep. of ESA STD [log10(deg)/log10(GHz)]

XPR_mu =               8            % cross-polarization ratio [dB]
XPR_sigma =            3            % cross-polarization ratio STD [dB]

LSP_fc_min =           2            % lower limit of fc for the frequency-dependent terms [GHz]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

DS_lambda =            10           % DS decorrelation distance [m]
KF_lambda =            10           % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            13           % SF decorrelation distance [m]
AS_D_lambda =          10           % ASD decorrelation distance [m]
AS_A_lambda =          9            % ASA decorrelation distance [m]
ES_D_lambda =          10           % ESD decorrelation distance [m]
ES_A_lambda =          10           % ESA decorrelation distance [m]
XPR_lambda =           15           % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0     -0.7    0      0.4   -0.5    0      0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |  -0.7    0      1      0     -0.4    0      0      0     | SF
% R = |   0      0      0      1      0      0.5    0.5    0     | ASD
%     |   0.4    0     -0.4    0      1      0      0.2    0     | ASA
%     |  -0.5    0      0      0.5    0      1      0      0     | ESD
%     |   0      0      0      0.5    0.2    0      1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_sf =               -0.7          % DS vs. SF
asA_ds =               0.4          % DS vs. ASA
esD_ds =              -0.5          % DS vs. ESD
asA_sf =              -0.4          % SF vs. ASA
esD_asD =              0.5          % ASD vs. ESD
esA_asD =              0.5          % ASD vs. ESA
esA_asA =              0.2          % ASA vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-1, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          20           % number of clusters (19 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
NumClusters_min =      7            % lower end of the cluster-count range, counted like NumClusters (TR: D1 = 6)

r_DS =                 2.1          % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterDS =         11           % cluster delay spread [ns]
PerClusterAS_D =       10           % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       22           % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       0.594        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       7            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 0.2 of the ESD mean.

% ==================================================================================================
% EoD offset (elevation of departure, TR: ZOD offset)
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-8
% ==================================================================================================

% TR: mu_offset,ZOD = -10^{ -1.5 log10(max(10, d2D)) + 3.3 }
%
% QuaDRiGa uses elevation angles: EoD offset = - mu_offset,ZOD. A positive value raises the departure direction.
%
% EoD offset [deg] = EoD_offset_e + EoD_offset_e_gamma * log10(fGHz)
%       + 10^( (EoD_offset_a + EoD_offset_a_gamma * log10(fGHz)) * log10(max(EoD_offset_b, d2D))
%              + EoD_offset_c + EoD_offset_c_gamma * log10(fGHz) + EoD_offset_c_hUT * hUT )     if EoD_offset_b > 0
%       + atand((hcl - hBS)/d2D) - atand((hUT - hBS)/d2D)                                       if hcl > 0 and hUT < hcl

EoD_offset_a =        -1.5          % distance exponent
EoD_offset_b =         10           % minimum 2D distance [m]; 0 = no power term
EoD_offset_c =         3.3          % constant of the exponent

% ==================================================================================================
% Absolute time of arrival offset
% See: 3GPP TR 38.901 v19.5.0; Clause 7.6.9, Table 7.6.9-1
% ==================================================================================================

absTOA_mu =           -7.5          % absolute time of arrival offset reference value [log10(s)]
absTOA_sigma =         0.5          % absolute time of arrival offset reference STD [log10(s)]
absTOA_lambda =        15           % absolute time of arrival offset decorrelation distance [m]

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                2            % number of strongest clusters with scaling factor 1
NF_alpha =             1.53         % parameter alpha of the Beta distribution
NF_beta =              1.42         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.49         % mean of the probability Pr_sns
SNS_sigma =            0.18         % STD of the probability Pr_sns
SNS_A =                0.12         % visibility region parameter A
SNS_B =                0.48         % visibility region parameter B
SNS_R =                50           % visibility region parameter R [dB]
SNS_delta_var =        0.001        % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            15           % decorrelation distance [m]; 0 = disabled

% The decorrelation distances of the LOS/NLOS state and the indoor/outdoor state (Table 7.6.3.1-2) apply to all
% links of a scenario and are stated once: LOS_state_lambda in the NLOS file(s), IO_state_lambda in the O2I files.
% In the other files of the scenario these keys are 0, which means "not stated here".

LOS_state_lambda =     50           % decorrelation distance of the LOS/NLOS state [m], Table 7.6.3.1-2; used by the caller

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL1 = 32.4 + 21 log10(d3D) + 20 log10(fc);  PL2 = 32.4 + 40 log10(d3D) + 20 log10(fc) - 9.5 log10(dBP^2 + (hBS-hUT)^2)
%       dBP = 4 (hBS-hE) (hUT-hE) fc/c, hE = 1 m (note 1)
% NLOS: PL = max( PL_LOS, 35.3 log10(d3D) + 22.4 + 21.3 log10(fc) - 0.3 (hUT - 1.5) )
% Optional NLOS formula of Table 7.4.1-1 (UMi): PL = 32.4 + 20 log10(fc) + 31.9 log10(d3D), SF std 8.2 dB.
% It is used with PL_model = logdist, PL_A = 31.9, PL_B = 32.4, PL_C = 20, PL_SF = 8.2.

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Formula for the QuaDRiGa model "nlos":
%    PLn = An * log10( d3D ) + Bn + Cn * log10( fGHz ) + Dn * log10( hBS ) + D2n * log10( hBS ) / hBS^2
%        + E3n * hUT + Fn * log10( hBS ) * log10( d3D ) + G1n * log10^2( G2n * hUT )
%     PL = max( PL_LOS, PLn )

PL_model =             nlos         % path-loss model
PL_A1 =                21           % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                40           % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 32.4         % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 13.33        % Breakpoint scaling factor
PL_hE =                1            % Environment height in [m]
PL_An =                35.3         % TX-RX 3D dist.-dep. of NLOS-PL [dB/log10(m)]
PL_Bn =                22.85        % Reference NLOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.; includes 0.3 * 1.5 of the height term
PL_Cn =                21.3         % Freq.-dep. of the NLOS-PL in [dB/log10(GHz)]
PL_E3n =              -0.3          % RX height-dep. of the NLOS-PL in [dB/m]

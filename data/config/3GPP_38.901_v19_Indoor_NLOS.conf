% Config file for scenario "3GPP_38.901_v19_Indoor_NLOS"
% See: 3GPP TR 38.901 v19.5.0 (2026-09)
%
% SPDX-License-Identifier: Apache-2.0
% Copyright (C) 2022-2026 Stephan Jaeckel (http://quadriga-lib.org)
% Part of quadriga-lib - see LICENSE for terms.
%
% All angles and angular spreads follow the QuaDRiGa convention: elevation angles, +90 deg is up.
% The TR uses zenith angles (ZSD, ZSA, ZOD). Spreads and their correlations are the same in both
% conventions (ESD = ZSD, ESA = ZSA); the EoD offset has the opposite sign of the ZOD offset.

% Valid frequency range:        0.5 to 100 GHz
% Valid distance range:         1 to 150 m
% Valid BS antenna height:      3 m
% Valid MT antenna height:      1 m

% ==================================================================================================
% Large scale distributions
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, Table 7.5-10
% ==================================================================================================

% DS  = -7.173 - 0.28 * log10( 1 + fGHz ) + Xds * ( 0.055 + 0.1 * log10( 1 + fGHz ) )
% KF  = -100 + Xkf * ( 0 )
% SF  = Xsf * ( 8.03 )
% ASD = 1.62 + Xasd * ( 0.25 )
% ASA = 1.863 - 0.11 * log10( 1 + fGHz ) + Xasa * ( 0.059 + 0.12 * log10( 1 + fGHz ) )
% ESD = 1.08 + Xesd * ( 0.36 ), see below
% ESA = 1.387 - 0.15 * log10( 1 + fGHz ) + Xesa * ( 0.746 - 0.09 * log10( 1 + fGHz ) )
% XPR = 10 + Xxpr * ( 4 )

% For frequencies below 6 GHz, fc = 6 GHz is used in the frequency-dependent terms (LSP_fc_min).

DS_mu =               -7.173        % delay spread [log10(s)]
DS_sigma =             0.055        % delay spread STD [log10(s)]
DS_omega =             1            % reference frequency offset for the DS [GHz]
DS_gamma =            -0.28         % freq.-dep. of DS [log10(s)/log10(GHz)]
DS_delta =             0.1          % freq.-dep. of DS STD [log10(s)/log10(GHz)]

KF_mu =               -100          % Ricean K-factor [dB]; -100 switches the LOS path off
KF_sigma =             0            % Ricean K-factor STD [dB]

SF_sigma =             8.03         % Shadow Fading STD [dB]

AS_D_mu =              1.62         % azimuth of departure angle spread [log10(deg)]
AS_D_sigma =           0.25         % azimuth of departure angle spread STD [log10(deg)]

AS_A_mu =              1.863        % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.059        % azimuth of arrival angle spread STD [log10(deg)]
AS_A_omega =           1            % reference frequency offset for the ASA [GHz]
AS_A_gamma =          -0.11         % freq.-dep. of ASA [log10(deg)/log10(GHz)]
AS_A_delta =           0.12         % freq.-dep. of ASA STD [log10(deg)/log10(GHz)]

% ESD mean (TR: mu_lgZSD) = 1.08

ES_D_mu =              1.08         % elevation of departure angle spread [log10(deg)]
ES_D_sigma =           0.36         % elevation of departure angle spread STD [log10(deg)]

ES_A_mu =              1.387        % elevation of arrival angle spread [log10(deg)]
ES_A_sigma =           0.746        % elevation of arrival angle spread STD [log10(deg)]
ES_A_omega =           1            % reference frequency offset for the ESA [GHz]
ES_A_gamma =          -0.15         % freq.-dep. of ESA [log10(deg)/log10(GHz)]
ES_A_delta =          -0.09         % freq.-dep. of ESA STD [log10(deg)/log10(GHz)]

XPR_mu =               10           % cross-polarization ratio [dB]
XPR_sigma =            4            % cross-polarization ratio STD [dB]

LSP_fc_min =           6            % lower limit of fc for the frequency-dependent terms [GHz]

% ==================================================================================================
% Large-Scale fading decorrelation distances
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

DS_lambda =            5            % DS decorrelation distance [m]
KF_lambda =            4            % KF decorrelation distance [m]; not from the TR (N/A), carried over from QuaDRiGa
SF_lambda =            6            % SF decorrelation distance [m]
AS_D_lambda =          3            % ASD decorrelation distance [m]
AS_A_lambda =          3            % ASA decorrelation distance [m]
ES_D_lambda =          4            % ESD decorrelation distance [m]
ES_A_lambda =          4            % ESA decorrelation distance [m]
XPR_lambda =           4            % XPR decorrelation distance [m]; not from the TR, carried over from QuaDRiGa

% ==================================================================================================
% Inter-parameter correlations
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2
% ==================================================================================================

%          DS     KF     SF     ASD    ASA    ESD    ESA    XPR
%     |   1      0     -0.5    0.4    0     -0.27  -0.06   0     | DS
%     |   0      1      0      0      0      0      0      0     | KF
%     |  -0.5    0      1      0     -0.4    0      0      0     | SF
% R = |   0.4    0      0      1      0      0.35   0.23   0     | ASD
%     |   0      0     -0.4    0      1     -0.08   0.43   0     | ASA
%     |  -0.27   0      0      0.35  -0.08   1      0.42   0     | ESD
%     |  -0.06   0      0      0.23   0.43   0.42   1      0     | ESA
%     |   0      0      0      0      0      0      0      1     | XPR

ds_sf =               -0.5          % DS vs. SF
asD_ds =               0.4          % DS vs. ASD
esD_ds =              -0.27         % DS vs. ESD
esA_ds =              -0.06         % DS vs. ESA
asA_sf =              -0.4          % SF vs. ASA
esD_asD =              0.35         % ASD vs. ESD
esA_asD =              0.23         % ASD vs. ESA
esD_asA =             -0.08         % ASA vs. ESD
esA_asA =              0.43         % ASA vs. ESA
esD_esA =              0.42         % ESD vs. ESA

% ==================================================================================================
% Model parameters
% See: 3GPP TR 38.901 v19.5.0; Table 7.5-6 Part-2, eq. (7.6-7), Table 7.6.15-1
% ==================================================================================================

NumClusters =          20           % number of clusters (19 NLOS clusters + 1 for the disabled LOS path)
NumSubPaths =          20           % number of paths per (NLOS) cluster
SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
NumClusters_min =      7            % lower end of the cluster-count range, counted like NumClusters (TR: D1 = 6)

r_DS =                 3            % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

PerClusterAS_D =       5            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       11           % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       4.508        % cluster elevation of departure angle spread [deg], see below
PerClusterES_D_scale = 0.375        % cluster ESD as fraction of 10^(ESD mean); 0 = use PerClusterES_D
PerClusterES_A =       9            % cluster elevation of arrival angle spread [deg]

% The TR defines the cluster ESD per link as 3/8 * 10^(ESD mean), eq. (7.6-7); this is PerClusterES_D_scale.
% PerClusterES_D is for consumers that do not know this key. It is 3/8 * 10^x with x = the constant 1.08 of the ESD mean.

% ==================================================================================================
% Absolute time of arrival offset
% See: 3GPP TR 38.901 v19.5.0; Clause 7.6.9, Table 7.6.9-1
% ==================================================================================================

absTOA_mu =           -8.6          % absolute time of arrival offset reference value [log10(s)]
absTOA_sigma =         0.1          % absolute time of arrival offset reference STD [log10(s)]
absTOA_lambda =        10           % absolute time of arrival offset decorrelation distance [m]
absTOA_Lmax =          120          % largest dimension L of the room [m]; excess delay <= 2L/c

% The TR bounds the excess delay by 2L/c, L = largest dimension of the office room.
% L of the office of TR Table 7.2-2 (120 x 50 x 3 m): 120 m; set absTOA_Lmax for another room.

% ==================================================================================================
% Optional modelling components
% See: 3GPP TR 38.901 v19.5.0; Clauses 7.6.13, 7.6.14.1.3, 7.6.16
% ==================================================================================================

% The values below are the table values of the TR. Whether a component is active is a setting
% of the simulation, not of this file.

% Near-field model, Table 7.6-13-1
NF_k1 =                4            % number of strongest clusters with scaling factor 1
NF_alpha =             1.25         % parameter alpha of the Beta distribution
NF_beta =              1.27         % parameter beta of the Beta distribution

% Spatial non-stationarity at the BS, stochastic model, Tables 7.6.14.1.2-1 and 7.6.14.1.2-2
SNS_mu =               0.31         % mean of the probability Pr_sns
SNS_sigma =            0.08         % STD of the probability Pr_sns
SNS_A =                0            % visibility region parameter A
SNS_B =                0.6          % visibility region parameter B
SNS_R =                0            % visibility region parameter R [dB]; 0 = not applicable (A = 0)
SNS_delta_var =        0.0011       % variance of the visibility region parameter delta

% Polarization power variability, clause 7.6.16
PolVar_sigma =         3            % STD of the polarization variability powers [dB]

% ==================================================================================================
% Decorrelation distance for the small-scale fading spatial consistency
% See: 3GPP TR 38.901 v19.5.0; Table 7.6.3.1-2
% ==================================================================================================

SC_lambda =            10           % decorrelation distance [m]; 0 = disabled

LOS_state_lambda =     10           % decorrelation distance of the LOS/NLOS state [m], Table 7.6.3.1-2; used by the caller

% ==================================================================================================
% Path-loss model
% See: 3GPP TR 38.901 v19.5.0; Table 7.4.1-1
% ==================================================================================================

% (Distances and heights in meters, frequency fc in GHz)
% LOS:  PL = 32.4 + 17.3 log10(d3D) + 20 log10(fc)
% NLOS: PL = max( PL_LOS, 38.3 log10(d3D) + 17.30 + 24.9 log10(fc) )
% Optional NLOS formula of Table 7.4.1-1 (InH): PL' = 32.4 + 20 log10(fc) + 31.9 log10(d3D), SF std 8.29 dB,
% used in max( PL_LOS, PL' ). It is used with PL_model = nlos, PL_An = 31.9, PL_Bn = 32.4, PL_Cn = 20, PL_sig = 8.29.

% Formula for the QuaDRiGa dual-slope (LOS) model:
%     PL = PL1 for d2D <= dBP | PL2 for d2D > dBP
%    PL1 = A1 * log10( d3D ) + B + C * log10( fGHz ) + D * d3D
%    PL2 = PL1( dBP ) + A2 * log10( d3D / dBP )
%    dBP = E * ( hBS-hE ) * ( hMS-hE ) * fGHz

% Formula for the QuaDRiGa model "nlos":
%    PLn = An * log10( d3D ) + Bn + Cn * log10( fGHz ) + Dn * log10( hBS ) + D2n * log10( hBS ) / hBS^2
%        + E3n * hUT + Fn * log10( hBS ) * log10( d3D ) + G1n * log10^2( G2n * hUT )
%     PL = max( PL_LOS, PLn )

PL_model =             nlos         % path-loss model
PL_A1 =                17.3         % TX-RX 3D dist.-dep. of the LOS-PL before break-point [dB/log10(m)]
PL_A2 =                17.3         % TX-RX 3D dist.-dep. of the LOS-PL after break-point [dB/log10(m)]
PL_B =                 32.4         % Reference LOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % Freq.-dep. of the LOS-PL in [dB/log10(GHz)]
PL_E =                 13.33        % Breakpoint scaling factor
PL_hE =                0            % Environment height in [m]
PL_An =                38.3         % TX-RX 3D dist.-dep. of NLOS-PL [dB/log10(m)]
PL_Bn =                17.3         % Reference NLOS-PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_Cn =                24.9         % Freq.-dep. of the NLOS-PL in [dB/log10(GHz)]

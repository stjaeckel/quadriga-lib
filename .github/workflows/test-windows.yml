# Builds quadriga-lib on Windows with MSVC and runs the C++, Python and MATLAB tests.
#
# Started by hand only: on GitHub (Actions -> "Windows tests" -> "Run workflow") or with
#   gh workflow run test-windows.yml --ref <branch>
#
# The jobs call the targets of the nmake Makefile, so a failure here can be reproduced on a Windows machine with the
# same command. windows-2022 has Visual Studio 2022 (MSVC v143), the compiler of the Windows release builds; MATLAB
# does not support Visual Studio 2026 yet. Each build step loads the MSVC environment with vcvars64.bat first.

name: Windows tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # C++ (test_bin) and Python tests: "nmake test" without MATLAB
  test:
    name: C++, Python
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.14 is the newest Python that pyproject.toml builds wheels for
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Python packages
        run: python -m pip install numpy pytest

      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          nmake /f Makefile test matlab=OFF

  # MATLAB MEX tests. MathWorks licenses MATLAB for public repositories only inside its own actions, so the tests run
  # through run-command and not through "nmake test".
  matlab:
    name: MATLAB
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build MATLAB MEX files
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          nmake /f Makefile all python=OFF || exit /b 1
          nmake /f Makefile moxunit-lib

      # R2024a is the oldest supported release; MEX files built against it also load in newer releases
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024a
          cache: true

      - name: Run MATLAB MEX tests
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: run('tests/quadriga_lib_mex_tests.m')

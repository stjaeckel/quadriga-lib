# Builds quadriga-lib on Ubuntu and runs the C++, Octave and Python tests on x86_64 and aarch64, and the MATLAB tests
# on x86_64 (there is no MATLAB for Linux on ARM).
#
# Started by hand only: on GitHub (Actions -> "Linux tests" -> "Run workflow") or with
#   gh workflow run test-linux.yml --ref <branch> [-f arch=x86_64|aarch64]
#
# The jobs call the GNUmakefile targets, so a failure here can be reproduced locally with the same command.

name: Linux tests

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architectures to test (MATLAB runs with all and x86_64)
        type: choice
        options: [all, x86_64, aarch64]
        default: all

permissions:
  contents: read

jobs:
  # C++ (test_bin), Octave MEX and Python tests: "make test" without MATLAB, one job per architecture.
  # The exclude entries drop the architecture that was not chosen ("none" matches nothing).
  test:
    name: C++, Octave, Python (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        exclude:
          - arch: ${{ inputs.arch == 'x86_64' && 'aarch64' || 'none' }}
          - arch: ${{ inputs.arch == 'aarch64' && 'x86_64' || 'none' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools, Octave and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 ninja-build unzip \
            octave octave-dev \
            python3-dev python3-numpy python3-pytest

      - name: Build and test
        run: make test matlab=OFF

  # MATLAB MEX tests. MathWorks licenses MATLAB for public repositories only inside its own actions, so the tests run
  # through run-command and not through "make test".
  matlab:
    name: MATLAB (x86_64)
    if: inputs.arch != 'aarch64'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build unzip

      # MEX files are built with g++-12 (GNUmakefile default), whose libstdc++ the MATLAB-bundled one can load
      - name: Build MATLAB MEX files
        run: |
          make all octave=OFF python=OFF
          make moxunit-lib

      # The MEX files must not need libstdc++ or libgcc_s symbol versions that MATLAB R2024a does not bundle
      - name: Check MEX symbol versions
        run: bash tests/check_mex_symbol_versions.sh build_linux

      # R2024a is the oldest supported release; MEX files built against it also load in newer releases
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024a
          cache: true

      - name: Run MATLAB MEX tests
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: run('tests/quadriga_lib_mex_tests.m')
